<!DOCTYPE html>
<html>
<head>
  <title>Zilu – Connexion</title>
  <link rel="stylesheet" href="style-connexion.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 👉 SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<script type="module">
  // 👉 1. INIT Supabase
  const supabaseUrl = 'https://cidcezkgwrtgevjcvkao.supabase.co'; // ✅ ton URL
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpZGNlemtnd3J0Z2V2amN2a2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE4OTU2NzUsImV4cCI6MjA2NzQ3MTY3NX0.DlmA9BI6nRQ15DeCBxVEE2ZUek2iLVQDvxHrgQ8hAyQ';
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  // 👉 2. Connexion utilisateur
  document.getElementById("connexion").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const mdp = document.getElementById("motdepasse").value;

    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: mdp
    });

    if (error) {
      alert("Erreur de connexion : " + error.message);
    } else {
      // ✅ Connexion réussie
      alert("Bienvenue dans le cockpit Zilu !");
      window.location.href = "./dashboard.html";
    }
  });
</script>

<body>
  <div class="bande-gauche"></div>
  <div class="bande-droite"></div>
  <div class="contenu">
    <form id="connexion">
      <h2>Se connecter à Zilu</h2>

      <label for="email">Email :</label>
      <input type="email" id="email" name="email" required>

      <label for="motdepasse">Mot de passe :</label>
      <input type="password" id="motdepasse" name="motdepasse" required>

      <button type="submit">Connexion</button>
    </form>
  </div>
</body>
</html>
