<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Zilu – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style-dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }

    .stockage-container {
      max-width: 400px;
      margin: 40px auto;
      text-align: center;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .barre-externe {
      width: 100%;
      height: 20px;
      background-color: #eee;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    #barre-interne {
      height: 100%;
      width: 0%;
      background-color: #4CAF50;
      transition: width 0.5s ease;
    }

    .alerte-invisible { display: none; }
    .alerte-visible {
      display: block;
      color: orange;
      font-weight: bold;
      margin-top: 10px;
      animation: clignote 1s infinite;
    }

    @keyframes clignote {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .import-zone {
      margin-top: 30px;
      text-align: center;
    }

    #upload-file {
      margin-bottom: 10px;
    }

    #upload-status {
      margin-top: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <div class="stockage-container">
    <div id="profil">Chargement...</div>
    <h2>Tableau de bord Zilu</h2>
    <p>Stockage utilisé : <span id="utilisation">0</span> / 100 Mo</p>
    <div class="barre-externe">
      <div id="barre-interne"></div>
    </div>
    <p id="alerte" class="alerte-invisible">⚠️ Attention : stockage presque plein !</p>
  </div>

  <div class="import-zone">
    <input type="file" id="upload-file" />
    <br>
    <button id="envoyer-fichier">Importer vers Zilu Cloud</button>
    <p id="upload-status"></p>
	<div id="profil">Connecté en tant que : ...</div>
	<button id="logout">Déconnexion</button>

  </div>

  <script type="module">
    const supabase = supabase.createClient(
      "https://cidcezkgwrtgevjcvkao.supabase.co", // ✅ Ton URL
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpZGNlemtnd3J0Z2V2amN2a2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE4OTU2NzUsImV4cCI6MjA2NzQ3MTY3NX0.DlmA9BI6nRQ15DeCBxVEE2ZUek2iLVQDvxHrgQ8hAyQ"
    );

    const profil = document.getElementById("profil");
    const statut = document.getElementById("upload-status");
    const totalMo = 100;

    let userId = null;

    // 🔐 Récupérer l'utilisateur connecté
    const afficherProfil = async () => {
      const { data: { user }, error } = await supabase.auth.getUser();

      if (error || !user) {
        profil.innerText = "Aucun utilisateur connecté";
        window.location.href = "connexion.html";
      } else {
        profil.innerText = `Connecté en tant que : ${user.email}`;
        userId = user.id;
        calculerStockage();
      }
    };

    // 📊 Barre de stockage
    function updateBarre(tailleMo) {
      const utilisation = document.getElementById("utilisation");
      const barre = document.getElementById("barre-interne");
      const alerte = document.getElementById("alerte");

      const pourcentage = Math.floor((tailleMo / totalMo) * 100);
      utilisation.textContent = `${tailleMo.toFixed(2)} Mo`;
      barre.style.width = `${pourcentage}%`;

      if (pourcentage >= 90) {
        barre.style.backgroundColor = "red";
        alerte.textContent = "❌ Stockage plein ! Supprime ou archive un fichier.";
        alerte.classList.replace("alerte-invisible", "alerte-visible");
      } else if (pourcentage >= 80) {
        barre.style.backgroundColor = "orange";
        alerte.classList.replace("alerte-invisible", "alerte-visible");
      } else {
        barre.style.backgroundColor = "#4CAF50";
        alerte.classList.replace("alerte-visible", "alerte-invisible");
      }
    }

    // 🧮 Calcul du stockage Supabase
    async function calculerStockage() {
      const { data, error } = await supabase.storage.from('fichiers').list(userId, {
        limit: 100,
        offset: 0
      });

      if (error) {
        console.error("Erreur lecture bucket Supabase :", error);
        return;
      }

      let tailleTotale = 0;
      for (let fichier of data) {
        tailleTotale += fichier.metadata.size / (1024 * 1024); // octets → Mo
      }
      updateBarre(tailleTotale);
    }

    // 📁 Import de fichier
    const boutonUpload = document.getElementById("envoyer-fichier");
    const inputFichier = document.getElementById("upload-file");

    boutonUpload.addEventListener("click", async () => {
      const fichier = inputFichier.files[0];

      if (!fichier || !userId) {
        statut.textContent = "⚠️ Aucun fichier ou utilisateur non connecté.";
        return;
      }

      const chemin = `${userId}/${fichier.name}`;
      const { error } = await supabase.storage.from('fichiers').upload(chemin, fichier);

      if (error) {
        statut.textContent = `❌ Erreur d'upload : ${error.message}`;
      } else {
        statut.textContent = `✅ Fichier "${fichier.name}" importé !`;
        calculerStockage(); // 🔄 Mise à jour
      }
    });

    afficherProfil();
	
	document.getElementById("logout").addEventListener("click", async () => {
		await supabase.auth.signOut();
		window.location.href = "connexion.html";
	});

  </script>
</body>
</html>
