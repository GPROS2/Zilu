<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Zilu – Inscription</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style-connexion.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>
  <div class="bande-gauche"></div>
  <div class="bande-droite"></div>
  <div class="contenu">
    <form id="inscription">
      <h2>Créer un compte Zilu</h2>

      <label for="pseudo">Pseudo :</label>
      <input type="text" id="pseudo" name="pseudo" required>

      <label for="email">Email :</label>
      <input type="email" id="email" name="email" required>

      <label for="motdepasse">Mot de passe :</label>
      <input type="password" id="motdepasse" name="motdepasse" required>

      <button type="submit">S'inscrire</button>
    </form>
  </div>

  <script type="module">
    window.addEventListener("DOMContentLoaded", () => {
      const client = supabase.createClient(
        "https://cidcezkgwrtgevjcvkao.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." // ta vraie clé ici
      );

      const form = document.getElementById("inscription");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const mdp = document.getElementById("motdepasse").value;
        const pseudo = document.getElementById("pseudo").value;

        if (!pseudo || !email || !mdp) {
          alert("⚠️ Tous les champs sont obligatoires !");
          return;
        }

        const { data, error } = await client.auth.signUp({
          email,
          password: mdp,
          options: {
            redirectTo: "https://gpros2.github.io/Zilu/dashboard.html"
          }
        });

        if (error) {
          alert("❌ Erreur : " + error.message);
        } else {
          alert("✅ Compte créé avec succès ! Vérifie ton email 📩");
        }
      });
    });
  </script>
</body>
</html>
