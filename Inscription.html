<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Zilu – Inscription</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style-connexion.css"> <!-- extension en minuscules -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>
  <div class="bande-gauche"></div>
  <div class="bande-droite"></div>
  <div class="contenu">
    <form id="inscription">
      <h2>Créer un compte Zilu</h2>

      <label for="pseudo">Pseudo :</label>
      <input type="text" id="pseudo" name="pseudo" required>

      <label for="email">Email :</label>
      <input type="email" id="email" name="email" required>

      <label for="motdepasse">Mot de passe :</label>
      <input type="password" id="motdepasse" name="motdepasse" required>

      <button type="submit">S'inscrire</button>
    </form>
  </div>

  <script type="module">
    // ✅ Initialisation Supabase
    const client = supabase.createClient(
      "https://cidcezkgwrtgevjcvkao.supabase.co", // ← Ton URL
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."      // ← Ta clé anon
    );

    // ✅ Écoute du formulaire
    document.getElementById("inscription").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const mdp = document.getElementById("motdepasse").value;

      const { data, error } = await client.auth.signUp({
        email,
        password: mdp,
        options: {
          redirectTo: "https://gpros2.github.io/Zilu/dashboard.html" // ← Modifie si besoin
        }
      });

      if (error) {
        alert("❌ Erreur : " + error.message);
      } else {
        alert("✅ Compte créé avec succès ! Vérifie ton email 📩");
      }
    });
  </script>
</body>
</html>
