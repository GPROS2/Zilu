<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Zilu – Inscription</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style-connexion.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>
  <div class="contenu">
    <form id="inscription">
      <!-- champs ici -->
    </form>
  </div>

  <script type="module">
    const supabase = supabase.createClient(
      "https://cidcezkgwrtgevjcvkao.supabase.co",
      "ta_clé_publique_ici"
    );

    document.getElementById("inscription").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const mdp = document.getElementById("motdepasse").value;

      const { data, error } = await supabase.auth.signUp({
        email,
        password: mdp,
        options: {
          redirectTo: "https://gpros2.github.io/Zilu/dashboard.html"
        }
      });

      if (error) {
        alert("❌ Erreur : " + error.message);
      } else {
        alert("✅ Compte créé ! Vérifie ton email 📩");
      }
    });
  </script>
</body>

</html>
